name: Build & publish multi-arch image to GHCR

# Release tags only. A push to main isn't built: a release pushes main and its
# tag together, and building both ran the same multi-hour build twice.
# Run the workflow manually to build a branch (publishes :<branch>).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (optional). The normal semver/branch/latest tags are produced automatically.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A CLI-build release (v2.0.4-9) is a semver pre-release to
      # metadata-action, which then skips {{major}}.{{minor}}. Emit the base
      # (2.0.4) and minor (2.0) tags for it here.
      - name: Compute CLI-build tags
        id: clitags
        run: |
          ref="${GITHUB_REF_NAME:-}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-[0-9]+$ ]]; then
            echo "type=raw,value=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "type=raw,value=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag strategy:
          #   - push tag v1.5.0  -> :1.5.0, :1.5, :latest
          #   - push tag v2.0.4-9 -> :2.0.4-9, :2.0.4, :2.0, :latest
          #   - manual dispatch  -> :<branch>, plus `inputs.tag` if given (NEVER touches :latest)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            ${{ steps.clitags.outputs.tags }}

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # FFmpeg is pinned by FFMPEG_VERSION in the Dockerfile, so its layer
          # is reused from cache until the pin changes. Only bust it
          # (FFMPEG_REFRESH=<new token>) when building with FFMPEG_VERSION=latest.
          cache-from: type=gha
          cache-to: type=gha,mode=max
